---
# Installs a cron-based backup job on the OPNsense backup container.
# Fetches the OPNsense config via API daily and commits it to a git repo.
#
# Prerequisites:
#   - The backup container is deployed via Terraform and reachable via SSH
#   - SOPS secrets: opnsense_api_key, opnsense_api_secret, git_deploy_key
#   - config.env: OPNSENSE_HOST, OPNSENSE_BACKUP_GIT_REMOTE
#
# Usage:
#   ansible-playbook -i inventory.yaml setup-opnsense-backup-script.yaml

- name: Setup OPNsense backup script on backup container
  hosts: opnsense_backup
  gather_facts: false
  become: true

  vars:
    project_path: "{{ lookup('env', 'PROJECT_PATH') }}"
    sops: "{{ lookup('community.sops.sops', project_path + '/secrets.enc.yaml') | ansible.builtin.from_yaml }}"

    # Paths
    backup_script_dest: /usr/local/bin/opnsense-backup
    backup_env_dest: /etc/opnsense-backup.env
    backup_dir: /opt/opnsense-backup/repo
    deploy_key_dest: /root/.ssh/git_deploy_key
    cron_log: /var/log/opnsense-backup.log

    # Secrets / config from inventory
    opnsense_host: "{{ opnsense_host }}"
    opnsense_api_key: "{{ sops.opnsense_api_key }}"
    opnsense_api_secret: "{{ sops.opnsense_api_secret }}"
    git_remote: "{{ git_remote }}"
    git_deploy_key: "{{ sops.git_deploy_key }}"

  tasks:
    # ── Dependencies ──────────────────────────────────────────────────────────
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - git
          - curl
        state: present
        update_cache: true

    # ── Backup script ─────────────────────────────────────────────────────────
    - name: Deploy backup script
      ansible.builtin.copy:
        src: "{{ project_path }}/infra_components/opnsense/files/backup.sh"
        dest: "{{ backup_script_dest }}"
        owner: root
        group: root
        mode: '0755'

    # ── Environment file ──────────────────────────────────────────────────────
    - name: Deploy environment file
      ansible.builtin.template:
        src: "{{ project_path }}/infra_components/opnsense/files/opnsense-backup.env.tpl"
        dest: "{{ backup_env_dest }}"
        owner: root
        group: root
        mode: '0600'
      vars:
        opnsense_host: "{{ opnsense_host }}"
        opnsense_api_key: "{{ opnsense_api_key }}"
        opnsense_api_secret: "{{ opnsense_api_secret }}"
        git_remote: "{{ git_remote }}"
      no_log: true

    # ── SSH deploy key ────────────────────────────────────────────────────────
    - name: Ensure /root/.ssh exists
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy git SSH key
      ansible.builtin.copy:
        content: "{{ git_deploy_key }}"
        dest: "{{ deploy_key_dest }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Configure SSH to use deploy key for git host
      ansible.builtin.blockinfile:
        path: /root/.ssh/config
        create: true
        owner: root
        group: root
        mode: '0600'
        marker: "# {mark} opnsense-backup git deploy key"
        block: |
          Host github.com
            IdentityFile {{ deploy_key_dest }}
            StrictHostKeyChecking accept-new

    # ── Backup repo ───────────────────────────────────────────────────────────
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # ── Cron job ──────────────────────────────────────────────────────────────
    - name: Create cron log file
      ansible.builtin.file:
        path: "{{ cron_log }}"
        state: touch
        owner: root
        group: root
        mode: '0640'

    - name: Register daily backup cron job
      ansible.builtin.cron:
        name: opnsense-backup
        user: root
        hour: "3"
        minute: "0"
        job: "{{ backup_script_dest }} >> {{ cron_log }} 2>&1"
        state: present

    # ── Verify ────────────────────────────────────────────────────────────────
    - name: Run backup once to verify setup
      ansible.builtin.command:
        cmd: "{{ backup_script_dest }}"
      changed_when: false
      register: backup_verify

    - name: Show backup output
      ansible.builtin.debug:
        msg: "{{ backup_verify.stdout_lines }}"
