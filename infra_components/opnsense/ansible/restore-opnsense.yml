---
# Restores OPNsense from a config XML backup stored in git.
# Use this after a fresh OPNsense deploy from the Proxmox template.
#
# Prerequisites:
#   - OPNsense is freshly booted from the Proxmox template
#   - WAN/LAN interfaces are assigned (either from template or console)
#   - The API is reachable at opnsense_host
#
# Usage:
#   ansible-playbook -i inventory.yaml restore-opnsense.yml

- name: Restore OPNsense config from git backup
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    project_path: "{{ lookup('env', 'PROJECT_PATH') }}"
    sops: "{{ lookup('community.sops.sops', project_path + '/secrets.enc.yaml') | ansible.builtin.from_yaml }}"
    opnsense_host: "{{ lookup('env', 'OPNSENSE_HOST') }}"
    opnsense_api_key: "{{ sops.opnsense_api_key }}"
    opnsense_api_secret: "{{ sops.opnsense_api_secret }}"
    backup_dir: "{{ project_path }}/infra_components/opnsense/opnsense-config"
    backup_file: "{{ backup_dir }}/config.xml"

  tasks:
    - name: Check backup file exists
      ansible.builtin.stat:
        path: "{{ backup_file }}"
      register: backup_stat

    - name: Fail if no backup file found
      ansible.builtin.fail:
        msg: >
          No backup found at {{ backup_file }}.
          Run the backup job first, or check out the repo.
      when: not backup_stat.stat.exists

    - name: Read config XML
      ansible.builtin.slurp:
        src: "{{ backup_file }}"
      register: config_xml
      no_log: true

    - name: Upload config to OPNsense API
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/core/backup/restore"
        method: POST
        headers:
          Authorization: "Basic {{ (opnsense_api_key + ':' + opnsense_api_secret) | b64encode }}"
          Content-Type: "application/json"
        body_format: json
        body:
          content: "{{ config_xml.content }}"
        validate_certs: false
        status_code: 200
        timeout: 60
      register: restore_response
      no_log: true

    - name: Check restore succeeded
      ansible.builtin.assert:
        that:
          - restore_response.json.status == 'ok'
        fail_msg: >
          Restore failed: {{ restore_response.json | to_nice_json }}

    - name: Reboot OPNsense to apply restored config
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/core/firmware/reboot"
        method: POST
        headers:
          Authorization: "Basic {{ (opnsense_api_key + ':' + opnsense_api_secret) | b64encode }}"
        body_format: json
        body: {}
        validate_certs: false
        status_code: 200
      no_log: true

    - name: Wait for OPNsense to come back up
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/core/firmware/status"
        method: GET
        headers:
          Authorization: "Basic {{ (opnsense_api_key + ':' + opnsense_api_secret) | b64encode }}"
        validate_certs: false
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 30
      delay: 10
      no_log: true

    - name: Restore complete
      ansible.builtin.debug:
        msg: "OPNsense config restored and router is back online"
