# Hosts are not listed here: they are registered at runtime from the node
# registry (nodes.json at the project root, written by the PXE infra) by
# register-nodes.yaml, which every playbook imports first. This file only
# carries group vars.
all:
  vars:
    project_path: "{{ lookup('env','PROJECT_PATH')}}"
    sops: "{{ lookup('community.sops.sops', project_path+'/secrets.enc.yaml') | ansible.builtin.from_yaml }}"
  children:
    proxmox:
      vars:
        ansible_python_interpreter: /usr/bin/env python3
        ansible_user: "{{ lookup('env','ANSIBLE_USER') }}"
        root_user: root
        ansible_ssh_private_key_file: "{{ lookup('env','ANSIBLE_SSH_PRIVATE_KEY_FILE') }}"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        ansible_ssh_public_key: "{{ lookup('env','ANSIBLE_SSH_PUBLIC_KEY') }}"
        iscsi_portal: "{{ lookup('env','ANSIBLE_ISCSI_PORTAL') }}"
        iscsi_iqn: "{{ lookup('env','ANSIBLE_ISCSI_IQN') }}"
        root_password: "{{ sops.proxmox_root_password }}" 
        terraform_prov_password: "{{ sops.terraform_prov_password }}" 

    proxmox_bootstrap:
      vars:
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: "{{ lookup('env','ANSIBLE_USER') }}"
        root_user: root
        ansible_ssh_private_key_file: "{{ lookup('env','ANSIBLE_SSH_PRIVATE_KEY_FILE') }}"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"
        ansible_ssh_public_key: "{{ lookup('env','ANSIBLE_SSH_PUBLIC_KEY') }}"
        ansible_password: "{{ sops.proxmox_root_password }}"
        ansible_become_password: "{{ sops.proxmox_root_password }}"
