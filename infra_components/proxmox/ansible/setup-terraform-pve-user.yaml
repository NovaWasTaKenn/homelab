- name: Setup automation users
  hosts: proxmox
  gather_facts: false
  connection: local
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ ansible_host }}"
      api_user: root@pam
      api_password: "{{ root_password }}"
      validate_certs: false
  roles: 
    - role: create_pve_user
      vars: 
          ansible_python_interpreter: "/nix/store/l9k0anq0z7zz81zcwy035jfwap9ga6rl-python3-3.13.13/bin/python3"
          pve_api_base: 'https://{{ ansible_host }}:8006/api2/json'
          playbook_user: root@pam
          playbook_password: '{{ root_password }}'
          pve_user: "terraform-prov@pve"
          pve_role: "TerraformProv"
          pve_user_password: "{{ terraform_prov_password }}"
          terraform_user: "terraform-prov@pve"
          project_dir: '/home/quentin/Repos/homelab/layer1/ansible'
          pve_privileges:
            - VM.Allocate
            - Datastore.Audit
            - VM.Config.CPU
            - SDN.Use
            - VM.Clone
            - Pool.Allocate
            - Datastore.Allocate
            - Datastore.AllocateSpace
            - VM.Config.Options
            - VM.PowerMgmt
            - Datastore.AllocateTemplate
            - VM.Config.HWType
            - VM.Config.CDROM
            - Sys.Console
            - Sys.Audit
            - VM.Audit
            - Sys.Modify
            - VM.GuestAgent.Audit
            - VM.Migrate
            - VM.Config.Cloudinit
            - VM.Config.Memory
            - VM.Config.Disk
            - VM.Config.Network
            - VM.Console    
