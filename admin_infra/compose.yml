# PXE infrastructure for unattended Proxmox installation
# Run on your PC: podman-compose up -d
#
# ISP router DHCP options:
#   Option 66 (TFTP server): your PC's IP
#   Option 67 (boot file):   ipxe.efi

services:

  # ── TFTP — serves the iPXE EFI binary ──────────────────────────────────────
  dnsmasq:
    build: ./dnsmasq-server
    container_name: pxe-dnsmasq
    network_mode: host
    volumes:
      - ./tftp:/srv/tftp:ro
    restart: unless-stopped
    cap_add: 
    - NET_ADMIN
    - NET_RAW

  # ── HTTP — static files (GET) + answer file (POST /answer) ─────────────────
  http:
    build: ./http-server
    container_name: pxe-http
    network_mode: host
    environment:
      PORT: "8080"
      STATIC_DIR: /srv
      ANSWER_DIR: /answers
      ROOT_PASSWORD: ${PROXMOX_ROOT_PASSWORD}
      NODE_PREFIX: ${NODE_PREFIX}
      ADMIN_HOST: ${ADMIN_HOST}
    volumes:
      - ./http-files:/srv:ro
      - ./http-files/proxmox-answers:/answers:ro
      - ./http-data:/data
    restart: unless-stopped
