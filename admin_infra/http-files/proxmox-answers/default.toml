[global]
keyboard = "fr"
country = "fr"
fqdn = "pve-node.pve.local"
mailto = ""
timezone = "Europe/Paris"
root_password = "changeme"   # change before use

[network]
source = "from-dhcp"

[disk-setup]
filesystem = "ext4"
# Matches first available disk — refine with filter for multi-disk nodes
disk_list = ["sda"]
# For ZFS:
# filesystem = "zfs"
# zfs.raid = "raid0"
# disk_list = ["sda"]

[first-boot]
# Install qemu-guest-agent and set up ansible user after install
source = "from-url"
url = "http://192.168.1.95/first-boot.sh"
ordering = "fully-up"
