# tasks file for ansible_roles/create_pve_user
---
# ── Auth ticket (needed for POST/PUT/DELETE via uri module) ──────────────
- name: Get Proxmox auth ticket and CSRF token
  uri:
    url: "{{ pve_api_base }}/access/ticket"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ playbook_user }}"
      password: "{{ playbook_password }}"
    validate_certs: false
    status_code: 200
  register: auth
  no_log: false

- name: Set auth facts
  set_fact:
    pve_ticket: "{{ auth.json.data.ticket }}"
    pve_csrf: "{{ auth.json.data.CSRFPreventionToken }}"
  no_log: false

# ── Role ─────────────────────────────────────────────────────────────────
- name: Create role
  community.proxmox.proxmox_role:
    roleid: "{{ pve_role }}"
    privs: "{{ pve_privileges | join(',') }}"
    state: present

# ── User ─────────────────────────────────────────────────────────────────
- name: Create terraform-prov@pve user
  community.proxmox.proxmox_user:
    userid: "{{ pve_user }}"
    comment: "Terraform provisioner account"
    enable: true
    state: present
  no_log: false

# ── ACL ──────────────────────────────────────────────────────────────────
- name: Assign role to user  on path /
  community.proxmox.proxmox_access_acl:
    path: /
    type: user
    ugid: "{{ pve_user }}"
    roleid: "{{ pve_role }}"
    propagate: true
    state: present

# ── API Token (via REST API — no pveum needed) ────────────────────────────
- name: Check if API token already exists
  uri:
    url: "{{ pve_api_base }}/access/users/{{ pve_user | urlencode }}/token/terraform"
    method: GET
    headers:
      Cookie: "PVEAuthCookie={{ pve_ticket }}"
    validate_certs: false
    status_code: [200, 500]   # 500 = not found in Proxmox API
  register: token_check
  no_log: false

- name: Create API token for user
  uri:
    url: "{{ pve_api_base }}/access/users/{{ pve_user | urlencode }}/token/terraform"
    method: POST
    headers:
      Cookie: "PVEAuthCookie={{ pve_ticket }}"
      CSRFPreventionToken: "{{ pve_csrf }}"
    body_format: json
    body:
      privsep: 0
      comment: "Terraform provider token"
    validate_certs: false
    status_code: 200
  register: token_result
  when: token_check.status == 500
  no_log: false

- name: Parse token secret
  set_fact:
    api_token_secret: "{{ token_result.json.data.value }}"
  when: token_result is not skipped
  no_log: false

# ── Write vault ───────────────────────────────────────────────────────────
- name: Write API token to vault file
  when: token_result is not skipped
  copy:
    dest: "{{ project_dir }}/vault.yml"
    content: |
      # Generated by setup-terraform-prov.yml
      # Encrypt with: ansible-vault encrypt vault.yml
      terraform_api_token_id: "{{ pve_user }}!terraform"
      terraform_api_token_secret: "{{ api_token_secret }}"

      terraform_prov_password: "{{terraform_prov_password}}"
      ansible_password: "{{ansible_password}}"
    mode: '0600'
  no_log: false

- name: Remind to encrypt vault
  debug:
    msg: "API token written to vault.yml — run: ansible-vault encrypt vault.yml"
  when: token_result is not skipped

- name: Token already existed — skipped
  debug:
    msg: >
      Token 'terraform' already exists for {{ pve_user }}.
      vault.yml was not updated. Delete and recreate the token if you need
      the secret: DELETE /access/users/{{ pve_user }}/token/terraform
  when: token_result is skipped
