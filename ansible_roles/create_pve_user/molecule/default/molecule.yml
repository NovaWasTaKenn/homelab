---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    roles-path: "${HOME}/.ansible/collections/"


driver:
  name: molecule-proxmox
  options:
    api_host: "${PROXMOX_API}"
    api_user: "${PROXMOX_USER}"
    api_token_id: "${PROXMOX_TOKEN_ID}"
    api_token_secret: "${PROXMOX_TOKEN_SECRET}"
    node: "${PROXMOX_NODE}"
    ssh_user: ansible
    ssh_identity_file: "${HOME}/.ssh/id_ed25519"

platforms:
  - name: test-prov-user
    template_name: "${PROXMOX_TEMPLATE}"
    ciuser: ansible
    sshkeys: "${MOLECULE_SSH_PUBLIC_KEY}"
    ipconfig:
      ipconfig0: "ip=dhcp"
    nameservers:
      - "${PROXMOX_DNS}"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  inventory:
    group_vars:
      all: 
        proxmox_host: "homelab.pve.local"
        pve_api_base: "https://homelab.pve.local:8006/api2/json"
        pve_user: "terraform-prov@pve"
        pve_role: "TerraformProv"
        playbook_user: "root@pam"
        playbook_password: "${PROXMOX_ROOT_PASSWORD}"
        root_password: "${PROXMOX_ROOT_PASSWORD}"
        terraform_user: "terraform-prov@pve"
        pve_privileges:
          - VM.Allocate
          - Datastore.Audit
          - VM.Config.CPU
          - SDN.Use
          - VM.Clone
          - Pool.Allocate
          - Datastore.Allocate
          - Datastore.AllocateSpace
          - VM.Config.Options
          - VM.PowerMgmt
          - Datastore.AllocateTemplate
          - VM.Config.HWType
          - VM.Config.CDROM
          - Sys.Console
          - Sys.Audit
          - VM.Audit
          - Sys.Modify
          - VM.GuestAgent.Audit
          - VM.Migrate
          - VM.Config.Cloudinit
          - VM.Config.Memory
          - VM.Config.Disk
          - VM.Config.Network
          - VM.Console
        
verifier:
  name: ansible
